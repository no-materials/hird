[package]
name = "hird-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hirð compiler CLI"
publish = false

[[bin]]
name = "hird"
path = "src/main.rs"

[dependencies]
hird-parse = { workspace = true, features = ["std"] }
hird-ast.workspace = true
hird-check.workspace = true
hird-types.workspace = true
hird-ir.workspace = true
hird-codegen.workspace = true

clap = { version = "4", features = ["derive"] }
miette = { version = "7", default-features = false, features = ["fancy-no-syscall"] }
serde_json = "1"

[lints]
workspace = true
