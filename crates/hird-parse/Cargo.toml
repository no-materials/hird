[package]
name = "hird-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hirð parser and CST construction"
publish = false

[dependencies]
cstree.workspace = true
hird-lex.workspace = true
# Graphical diagnostic rendering. `fancy-no-syscall` pulls the report handler
# without any terminal/tty syscalls, so rendering stays deterministic.
miette = { default-features = false, features = [
    "fancy-no-syscall",
], optional = true, version = "7" }

[dev-dependencies]
insta = "1"
proptest = "1"

[lints]
workspace = true

[features]
# Opt-in terminal rendering of diagnostics via `miette`. The crate is `no_std`
# by default; enabling `std` pulls `miette` (which requires `std`).
std = ["dep:miette"]
