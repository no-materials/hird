[package]
name = "hird-lsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LSP server for Hirð"
publish = false

[[bin]]
name = "hird-lsp"
path = "src/main.rs"

[dependencies]
cstree.workspace = true
hird-ast.workspace = true
hird-check.workspace = true
hird-lex.workspace = true
hird-parse.workspace = true
hird-types.workspace = true

tokio = { features = ["io-std", "macros", "rt-multi-thread"], version = "1" }
tower-lsp = "0.20"

[dev-dependencies]
futures = "0.3"
serde_json = "1"
tower = { features = ["util"], version = "0.4" }

[lints]
workspace = true
